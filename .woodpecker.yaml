# Woodpecker CI — pipeline definition for Podbye.
#
# Woodpecker looks for this file (".woodpecker.yaml") in the repo root on every
# triggered pipeline. If you outgrow one file, replace it with a ".woodpecker/"
# directory: every *.yaml inside becomes its own workflow, and they run in
# parallel unless linked with "depends_on".
#
# The mental model: the SERVER schedules and shows results, an AGENT does the
# work, and every step runs inside its own container. Steps share one volume —
# the "workspace", which is the cloned repo — so files written by one step are
# visible to the next. Nothing else survives between steps: installing a package
# in step A does not make it available in step B.

# ── Workflow-level conditions ────────────────────────────────────────────
# Applies to the whole file. Without this the pipeline would also run on tags,
# releases, and cron. "manual" matters here: if your Woodpecker is on a LAN IP,
# GitHub cannot deliver webhooks to it, and the "Run pipeline" button in the UI
# is how you will actually trigger builds.
when:
  - event: [push, pull_request, manual]

steps:
  # ── 1. Tests ────────────────────────────────────────────────────────────
  - name: test
    image: python:3.12-slim
    environment:
      # tests/conftest.py sets this too, but a step that fails before conftest
      # loads (a collection error) is much clearer with it already set.
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    commands:
      # PySide6 links against these shared libraries at import time even when it
      # never opens a window. Without them you get an ImportError that looks
      # like a Python problem but is a missing .so.
      - apt-get update -qq
      - >-
        apt-get install -y --no-install-recommends
        libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 fontconfig
      - python -m pip install --quiet -r requirements-dev.txt
      - python -m pytest tests/ -q

  # ── 2. Byte-compile everything ──────────────────────────────────────────
  # Cheap syntax check across the whole package. Runs only if "test" succeeded,
  # because steps are serial by default.
  - name: compile
    image: python:3.12-slim
    commands:
      - python -m compileall -q app

  # ── 3. Windows build — deliberately disabled ────────────────────────────
  # PyInstaller cannot produce a Windows .exe from a Linux container: it bundles
  # the interpreter and DLLs of the machine it runs on. This step therefore
  # needs an agent running ON Windows (see the "local backend" notes in the
  # chat). Until such an agent exists, the condition below never matches, so the
  # step is skipped rather than failing every pipeline.
  #
  # To enable: run a Windows agent labelled platform=windows/amd64, then remove
  # the "evaluate: false" line.
  - name: build-windows
    image: powershell
    commands:
      - python -m pip install -r requirements.txt pyinstaller
      - python -m PyInstaller --noconfirm podbye.spec
    when:
      - evaluate: "false"
        platform: windows/amd64
        event: [tag, manual]
