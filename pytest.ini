[pytest]
# Put the project root on sys.path so tests can `import app.*`.
pythonpath = .
testpaths = tests

# Applied automatically by tests/conftest.py - never written by hand. CI runs
# "-m qt" and "-m 'not qt'" as two jobs so widget tests do not share one
# long-lived interpreter with everything else.
markers =
    qt: the module can put Qt widgets in the process
