    <rect x="144" y="96" width="48" height="48" fill="currentColor" stroke="none"/>
    <rect x="144" y="152" width="48" height="48" fill="currentColor" stroke="none"/>
    <rect x="48" y="152" width="48" height="48" fill="currentColor" stroke="none"/>
    <rect x="104" y="152" width="48" height="48" fill="currentColor" stroke="none"/>

    <rect x="64" y="72" width="16" height="16" fill="#fff" stroke="none"/>
