  <g fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="48" y="48" width="160" height="160" stroke-width="20"/>
    <path d="M48 104h160M48 152h160M104 48v160M152 48v160" stroke-width="10"/>
  </g>
  <g fill="currentColor">
