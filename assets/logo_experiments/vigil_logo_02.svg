  <title id="title">Vigil System Grid logo concept</title>
  <desc id="desc">A small network of square nodes connected by thick geometric paths.</desc>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M72 72h56v56h56" stroke="#141d18" stroke-width="34"/>
    <path d="M72 72h56v56h56" stroke="#d6e2da" stroke-width="18"/>
    <path d="M72 184h56v-56" stroke="#141d18" stroke-width="34"/>
    <path d="M72 184h56v-56" stroke="#8a9b8f" stroke-width="18"/>

    <rect x="44" y="44" width="56" height="56" fill="#141d18"/>
    <rect x="56" y="56" width="32" height="32" fill="#d6e2da"/>

    <rect x="100" y="100" width="56" height="56" fill="#141d18"/>
    <rect x="112" y="112" width="32" height="32" fill="#7cc596"/>

    <rect x="156" y="100" width="56" height="56" fill="#141d18"/>
    <rect x="168" y="112" width="32" height="32" fill="#d6e2da"/>

    <rect x="44" y="156" width="56" height="56" fill="#141d18"/>
    <rect x="56" y="168" width="32" height="32" fill="#8a9b8f"/>
  </g>
