<!--
  Vigil Logo 03: Watchpoint
  Abstract observer marker using fixed corner brackets and a central datum.
  Avoids eye, camera, shield, and security metaphors.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Vigil Watchpoint logo concept</title>
  <desc id="desc">A bracketed watchpoint marker with a central square datum and vertical signal mast.</desc>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M64 96V64h32" stroke="#d6e2da" stroke-width="22"/>
    <path d="M160 64h32v32" stroke="#d6e2da" stroke-width="22"/>
    <path d="M192 160v32h-32" stroke="#d6e2da" stroke-width="22"/>
    <path d="M96 192H64v-32" stroke="#d6e2da" stroke-width="22"/>

    <path d="M128 64v40" stroke="#8a9b8f" stroke-width="18"/>
    <path d="M128 152v40" stroke="#8a9b8f" stroke-width="18"/>

    <rect x="96" y="104" width="64" height="48" fill="#141d18"/>
    <rect x="108" y="116" width="40" height="24" fill="#7cc596"/>
    <rect x="120" y="124" width="16" height="8" fill="#d6e2da"/>
  </g>
</svg>
