# Build Podbye on GitHub's runners and attach the result to a release.
#
# The point is not convenience — it is evidence. A binary built here is
# provably the product of the public source in this repository, and the log is
# on the Actions tab for anyone who wants to check. That matters more than
# usual for a tool that asks to be trusted with someone's whole disk, and it
# is the closest thing to a code-signing certificate that costs nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # lets you produce a test build without tagging

permissions:
  contents: read

jobs:
  # app/version.py is the only place the version is written. A tag that
  # disagrees with it would publish an installer whose About screen names a
  # different release than the page it was downloaded from, so the mismatch
  # stops the run here, in seconds, before an hour of tests is spent on it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version and check the tag
        id: read
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version=$(python tools/release_version.py --tag "$REF_NAME")
          else
            version=$(python tools/release_version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Application version: $version"

  # The suite is the reason to believe the binary behaves. Build only if it
  # passes: a release that fails its own tests is worse than no release.
  #
  # This is tests.yml itself, not a copy of it. The one-process "pytest -q"
  # that used to run here is the exact configuration tests.yml had to split
  # into a qt job and a logic job - on a Windows runner it exhausts GDI
  # handles and the interpreter dies part-way with no test name. Calling the
  # workflow means the release always tests the way CI does.
  test:
    needs: version
    uses: ./.github/workflows/tests.yml

  build:
    needs: [version, test]
    runs-on: windows-latest
    permissions:
      contents: write         # needed to create the release and upload assets
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm podbye.spec

      # Guard the LGPL obligation mechanically rather than trusting the spec
      # to stay correct. Qt must arrive as replaceable files next to the exe,
      # and the license texts must ship with it.
      - name: Verify licence compliance of the build
        shell: pwsh
        run: |
          $qt = Get-ChildItem dist\Podbye\_internal\PySide6\Qt6*.dll -ErrorAction SilentlyContinue
          if ($qt.Count -lt 1) {
            throw "Qt DLLs are not present as separate files — the build must stay one-folder (LGPL v3 s4(d))."
          }
          foreach ($f in @(
              "dist\Podbye\_internal\LICENSE",
              "dist\Podbye\_internal\THIRD-PARTY-NOTICES.md",
              "dist\Podbye\_internal\licenses\LGPL-3.0.txt",
              "dist\Podbye\_internal\licenses\GPL-3.0.txt",
              "dist\Podbye\_internal\licenses\SIL-Open-Font-License-1.1.txt",
              "dist\Podbye\_internal\licenses\psutil-BSD-3-Clause.txt")) {
            if (-not (Test-Path $f)) { throw "missing from the build: $f" }
          }
          Write-Host "OK — $($qt.Count) replaceable Qt DLLs and all licence texts present."

      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\Podbye\Podbye.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Podbye exited on startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK — started and stayed running."

      - name: Package
        shell: pwsh
        run: |
          # A tag build is named by the version the tag was checked against;
          # anything else is marked as a development build of that version.
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = $env:APP_VERSION
          } else {
            $v = "$env:APP_VERSION-dev-" + $env:GITHUB_SHA.Substring(0,7)
          }
          echo "VERSION=$v" >> $env:GITHUB_ENV
          Compress-Archive -Path dist\Podbye\* -DestinationPath "Podbye-$v-windows-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup ships on the windows-latest image (6.7.1 at time of
          # writing). Resolve it rather than hardcoding the path, so a runner
          # image update that moves or renames it fails loudly here instead of
          # producing a release with no installer in it.
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" `
                      -ErrorAction SilentlyContinue | Select-Object -First 1 -Expand FullName
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found on this runner." }
          Write-Host "Using $iscc"
          # The installer keeps no version of its own; it is handed the one
          # app/version.py holds, and refuses to compile without it.
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\Podbye.iss
          if ($LASTEXITCODE -ne 0) { throw "installer compile failed ($LASTEXITCODE)" }
          Get-ChildItem installer\Output

      # Name the two files a release is made of and require exactly those.
      # A wildcard would publish whatever happened to match - or nothing at
      # all - and the checksums would faithfully describe the wrong set.
      - name: Verify release artifacts
        shell: pwsh
        run: |
          $expected = @(
            "Podbye-$env:VERSION-windows-x64.zip",
            "installer\Output\PodbyeSetup-$env:APP_VERSION.exe")
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { throw "expected release artifact is missing: $f" }
          }
          $zips = @(Get-ChildItem "Podbye-*.zip")
          $exes = @(Get-ChildItem installer\Output\*.exe)
          if ($zips.Count -ne 1 -or $exes.Count -ne 1) {
            throw "expected exactly one zip and one installer, found: $($zips.Name + $exes.Name -join ', ')"
          }
          Write-Host "OK — $($expected -join ', ')"

      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "Podbye-*.zip") + @(Get-ChildItem installer\Output\*.exe)
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Podbye-${{ env.VERSION }}
          path: |
            Podbye-*.zip
            installer/Output/*.exe
            SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true          # you review it before anyone sees it
          # 1.0.0-rc.1, 1.0.0-beta.5: anything with a pre-release suffix is
          # marked as one, so it is never offered as the latest stable build.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            Podbye-*.zip
            installer/Output/*.exe
            SHA256SUMS.txt
          body: |
            Podbye ${{ github.ref_name }} — Windows x64

            **Two ways to install**
            - `PodbyeSetup-*.exe` — installer, adds a Start Menu entry and an uninstaller.
            - `Podbye-*-windows-x64.zip` — unzip anywhere and run `Podbye.exe`.

            Windows will warn on first run: the build is not code-signed.
            Choose **More info -> Run anyway**. Verify against `SHA256SUMS.txt`
            if you prefer — these files were built by GitHub Actions from the
            source in this repository, and the log is on the Actions tab.

            Podbye has no cloud service and sends no telemetry. AI is optional and
            only ever talks to a runtime on this computer or on your private LAN.
