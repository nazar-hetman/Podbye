# Run the suite on every push and pull request.
#
# release.yml also runs pytest, but only when a v* tag is pushed — by which
# point a regression is already in main and the tag has to be deleted and
# recut. This runs the same suite at the moment the code arrives, so a red
# branch is visible before anyone builds a release out of it.
#
# Windows, because that is the only platform the app supports: the scanner,
# the Recycle Bin integration and the startup detector are all Win32.
name: Tests

on:
  # Branches only. A tag push never matches a branch filter, so release.yml
  # keeps sole ownership of tags and the suite is not run twice for one commit.
  push:
    branches: ["**"]
  # Fork PRs never appear as a push to this repo, so they need their own
  # trigger. A PR from a branch in this repo does run twice; that is the cost
  # of testing both, and the run is cancelled by the concurrency group anyway.
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs, one suite. Every test carries the "qt" marker or does not - the
  # marker is applied from each module's imports by tests/conftest.py, so the
  # two selections are exact complements and nothing can fall between them.
  #
  # Split because a single interpreter running every widget test exhausts
  # Windows GDI handles and dies with an access violation part-way through.
  # That is a crash, not a failure: it reports no test name, so a red run says
  # nothing about the code. This does not reduce the widgets the qt job
  # builds - it removes every non-Qt test from the process that accumulates
  # them, including the locale and AST-heavy tests where the crash has landed
  # every time. The jobs run in parallel, so the wall-clock is the longer of
  # the two rather than their sum.
  #
  # Neither job may be skipped or allowed to fail. If one crashes the run is
  # red, exactly as before.
  test:
    runs-on: windows-latest
    strategy:
      # Both jobs always run: the other half's result is still worth having
      # when one goes red.
      fail-fast: false
      matrix:
        include:
          - name: qt
            selection: "qt"
          - name: logic
            selection: "not qt"

    name: tests (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Guards the split itself. If the two selections ever stop adding up to
      # the whole suite, that is a silently skipped test, and it fails here
      # rather than going unnoticed for weeks.
      - name: Check the split covers every test
        run: python tools/check_test_split.py
        env:
          QT_QPA_PLATFORM: offscreen

      # No display on a runner. Qt needs to be told, or every widget test
      # dies on "could not connect to display" rather than on its assertion.
      - name: Run tests
        run: pytest -q -m "${{ matrix.selection }}"
        env:
          QT_QPA_PLATFORM: offscreen
