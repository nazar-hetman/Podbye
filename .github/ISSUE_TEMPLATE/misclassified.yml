name: Something was sorted wrongly
description: A folder was put in the wrong category, given the wrong risk, or left as "Unknown"
title: "[classification] "
labels: ["classification"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — this is the most useful kind of report Podbye gets. Nearly every
        classification rule in it exists because someone hit a folder shape it
        had never seen.

        You do not need to know why it went wrong. What the folder *is* and
        what Podbye *called it* is enough.

        **Please do not attach scan sessions or settings files.**
        Everything under `%APPDATA%\Podbye` lists your real folder paths,
        which usually means your username, your clients and your project
        names. None of it is needed here — the shape of a path is what
        matters, never the words in it. Redact screenshots the same way.

  - type: input
    id: path
    attributes:
      label: The path
      description: >
        Shorten or redact anything private — `D:\<project>\Ortho\run_001` is
        just as useful as the real name. The shape of the path matters, not the
        words in it.
      placeholder: C:\Program Files\WSL
    validations:
      required: true

  - type: input
    id: got
    attributes:
      label: What Podbye called it
      description: The category and risk shown on the row, e.g. "Documents · Review".
      placeholder: Documents · Review
    validations:
      required: true

  - type: input
    id: action
    attributes:
      label: What it offered to do about it
      description: >
        The button on the inspector, or the line where a button would be:
        "Move to Recycle Bin", "Deep Uninstall", or "Review the contents
        before removing anything". Offering the wrong *action* is more
        serious than showing the wrong label, so this one matters.
      placeholder: Move to Recycle Bin
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: Roughly how big
      description: The size on the row. A rough figure is fine.
      placeholder: 24.3 GB
    validations:
      required: true

  - type: input
    id: expected
    attributes:
      label: What it actually is
      placeholder: A drone photogrammetry output folder — mostly GeoTIFFs
    validations:
      required: true

  - type: textarea
    id: contents
    attributes:
      label: What is inside it
      description: >
        Roughly what the folder holds — the main file types and the rough size
        split. This is usually what pins the bug down.
      placeholder: |
        ~180 GB of .tif, some .ovr and .laz, one README.md at the top level
    validations:
      required: true

  - type: dropdown
    id: scan_scope
    attributes:
      label: What did you scan?
      options:
        - One folder
        - One drive
        - All drives
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Podbye version
      description: Shown under the wordmark in the sidebar.
      placeholder: v1.0.0-beta.5
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: >
        Settings > System > About, or run `winver`. The build number is
        the useful part.
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot of the row is welcome but not required.
    validations:
      required: false
